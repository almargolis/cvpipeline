[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cvpipeline"
version = "0.1.0"
description = "OpenCV vision pipeline and filter system extracted from VNAVS robotics framework"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    { name = "Albert Margolis", email = "almargolis@gmail.com" },
]
dependencies = [
    "ezcomms",
    "eztk",
    "opencv-python>=4.5.0",
    "numpy>=1.19.0",
    "Pillow>=8.0.0",
]

[project.scripts]
cvpipeline = "cvpipeline.cvpipeline:main"

[tool.setuptools.packages.find]
include = ["cvpipeline*"]
